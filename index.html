<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Retrieve — IELTS Reading Practice</title>
<meta name="description" content="A retrieval-practice PWA for IELTS Reading: read, close the passage, recall, check evidence, and review on a spaced schedule." />
<meta name="theme-color" content="#2F6F62" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Retrieve" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div id="app-shell">
  <div class="topbar" id="topbar">
    <div class="brand"><span class="mark">R</span> Retrieve</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="install-btn" style="display:none;" title="Install app">⤓</button>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">◐</button>
    </div>
  </div>

  <div id="app"></div>

  <nav class="tabbar">
    <button data-route="home" onclick="location.hash='#/home'"><span class="tico">⌂</span>Home</button>
    <button data-route="passages" onclick="location.hash='#/passages'"><span class="tico">▤</span>Passages</button>
    <button data-route="review" onclick="location.hash='#/review'" style="position:relative;"><span class="tico">◐</span>Review<span id="due-badge" class="badge" style="display:none;">0</span></button>
    <button data-route="paraphrase" onclick="location.hash='#/paraphrase'"><span class="tico">⇄</span>Paraphrase</button>
    <button data-route="errors" onclick="location.hash='#/errors'"><span class="tico">✕</span>Errors</button>
  </nav>

  <div id="toast"></div>
</div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
